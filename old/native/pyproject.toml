[build-system]
requires = ["maturin>=1.5,<2"]
build-backend = "maturin"

[project]
name = "memora-native"
version = "1.0.2"
description = "Optional compiled exact top-k vector kernel for Memora"
requires-python = ">=3.11"
license = { text = "MIT" }

[tool.maturin]
features = ["pyo3/extension-module"]
module-name = "memora_native"
